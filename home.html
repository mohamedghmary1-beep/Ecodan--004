function generateTaskKey(row) {
    let no = (row.no || "").trim();
    if (no && no !== "-") {
        return no.toLowerCase();
    }
    let fallback = `${row.title}_${row.discipline}_${row.activity}`.replace(/\s+/g, '').toLowerCase();
    return fallback;
}

// جلب بيانات جدول المهام مباشرة من Supabase
async function loadTasks() {
    try {
        const { data: rows, error } = await supabaseClient
            .from('submittals')
            .select('*');

        if (error) throw error;
        build(rows || []);
    } catch (err) {
        console.error("Error loading submittals:", err);
        document.getElementById('sidebar').innerHTML = T('failedToLoad');
    }
}

// جلب الطلبات المعلّقة فقط (status = pending) وبناء الخريطة + تحديث الشارة
async function loadPendingRequests() {
    try {
        const { data: rows, error } = await supabaseClient
            .from('upload_requests')
            .select('*')
            .eq('status', 'pending');

        if (error) throw error;

        pendingMap = {};
        (rows || []).forEach(r => {
            let key = `${r.task_key}||${r.revision_name.trim().toLowerCase()}`;
            pendingMap[key] = r;
        });

        updatePendingBadge((rows || []).length);
        render();
    } catch (err) {
        console.error("Error loading pending requests:", err);
    }
}

function updatePendingBadge(count) {
    let badge = document.getElementById('pendingNavBadge');
    if (!badge) return;
    if (count > 0) {
        badge.textContent = count > 99 ? "99+" : count;
        badge.style.display = "flex";
    } else {
        badge.style.display = "none";
    }
}

loadTasks();
loadPendingRequests();
setInterval(loadPendingRequests, PENDING_POLL_INTERVAL);

function handleFileSelection(input) {
    if (input.files.length === 0) return;
    let file = input.files[0];

    alert("جاري رفع الملف الآن... الرجاء الانتظار ثواني، وهيتبعت للمراجعة قبل ما يظهر.");

    let reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function () {
        let rawLog = reader.result.split(',')[1];

        fetch(GOOGLE_SCRIPT_UPLOAD_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
                filename: file.name,
                mimeType: file.type,
                data: rawLog,
                taskNo: currentUploadTaskKey,
                revName: currentUploadRevName,
                // بيانات إضافية تستخدمها الأداة السكربت لإرسال إيميل الإشعار
                notify: true,
                taskTitle: currentUploadTaskTitle,
                employee: currentUploadEmployee
            })
        })
        .then(res => res.json())
        .then(async (result) => {
            if (!result.url) {
                alert("خطأ أثناء الرفع: " + (result.error || "فشل الرفع"));
                return;
            }

            let uploadedUrl = result.url;

            let columnTarget = "link";
            let currentRevClean = currentUploadRevName.trim().toLowerCase();
            if (currentRevClean === "revision 1") columnTarget = "link_1";
            else if (currentRevClean === "revision 2") columnTarget = "link_2";
            else if (currentRevClean === "revision 3") columnTarget = "link_3";

            // بدل تحديث submittals مباشرة، بننشئ "طلب موافقة" معلّق
            const { data: insertedRows, error: insertError } = await supabaseClient
                .from('upload_requests')
                .insert({
                    task_key: currentUploadTaskKey,
                    raw_no: currentUploadRawNo,
                    task_title: currentUploadTaskTitle,
                    employee: currentUploadEmployee,
                    revision_name: currentUploadRevName,
                    column_target: columnTarget,
                    file_name: file.name,
                    file_link: uploadedUrl,
                    status: 'pending'
                })
                .select();

            if (insertError) {
                console.error("Failed to create approval request:", insertError);
                alert("تم رفع الملف على جوجل درايف، لكن فشل إنشاء طلب المراجعة في قاعدة البيانات.");
                return;
            }

            // تحديث فوري للواجهة من غير ما ننتظر إعادة تحميل من السيرفر
            let newReq = (insertedRows && insertedRows[0]) ? insertedRows[0] : {
                task_key: currentUploadTaskKey,
                revision_name: currentUploadRevName,
                file_name: file.name,
                file_link: uploadedUrl,
                status: 'pending'
            };
            let key = `${newReq.task_key}||${newReq.revision_name.trim().toLowerCase()}`;
            pendingMap[key] = newReq;
            render();
            updatePendingBadge(Object.keys(pendingMap).length);

            alert("تم إرسال الملف بنجاح لمراجعة المسؤول. هيظهر الرابط بعد الموافقة عليه.");
            loadPendingRequests();
        })
        .catch(err => {
            alert("حدث خطأ أثناء الاتصال بسكربت الرفع.");
            console.error(err);
        });
    };
    input.value = "";
}

function build(rows) {
    data = {}; 
    rows.forEach(row => {
        let emp = (row.action_by || "Unknown").trim();
        if (!data[emp]) data[emp] = [];

        let taskKey = generateTaskKey(row);

        data[emp].push({
            taskKey: taskKey,
            no: row.no,
            title: row.title,
            discipline: row.discipline,
            rev: row.rev,
            activity: row.activity,
            employee: emp,
            revisions: [
                { name: "Original", submitted: row.submitted_on, received: row.received_on, duration: row.duration, code: row.code, link: row.link },
                { name: "Revision 1", submitted: row.submitted_on_1, received: row.received_on_1, duration: row.duration_1, code: row.code_1, link: row.link_1 },
                { name: "Revision 2", submitted: row.submitted_on_2, received: row.received_on_2, duration: row.duration_2, code: row.code_2, link: row.link_2 },
                { name: "Revision 3", submitted: row.submitted_on_3, received: row.received_on_3, duration: row.duration_3, code: row.code_3, link: row.link_3 }
            ]
        });
    });

    // لو المستخدم مش Admin ولا Super Admin، يشوف بس التاسكات المرتبطة باسمه هو
    let isFullAccessRole = !window.currentUserRole || window.currentUserRole === 'admin' || window.currentUserRole === 'super_admin';
    if (!isFullAccessRole) {
        let myName = (window.currentUsername || '').trim().toLowerCase();
        let matchedKey = Object.keys(data).find(emp => emp.trim().toLowerCase() === myName);
        let filtered = {};
        if (matchedKey) filtered[matchedKey] = data[matchedKey];
        data = filtered;
    }

    renderSidebar();
    if (currentEmployee && data[currentEmployee]) {
        selected = data[currentEmployee];
        render();
    } else if (!isFullAccessRole) {
        // اختيار تلقائي لتاسكات المستخدم نفسه (مفيش سايدبار يدوي له)
        let onlyKey = Object.keys(data)[0];
        if (onlyKey) selectEmployee(onlyKey);
    }
}

function renderSidebar() {
    let isAdmin = !window.currentUserRole || window.currentUserRole === 'admin' || window.currentUserRole === 'super_admin';
    let html = "";
    Object.keys(data).forEach(emp => {
        let activeClass = emp === currentEmployee ? "active" : "";
        let openCount = data[emp].filter(t => computeTaskStatus(t) === "OPEN").length;
        let badgeHtml = openCount > 0 ? `<span class="emp-open-badge">${openCount}</span>` : "";
        html += `<div class="employee ${activeClass}" onclick="selectEmployee('${emp}')">
            <span>${emp}</span>${badgeHtml}
        </div>`;
    });
    if (!isAdmin && Object.keys(data).length === 0) {
        html = `<div style="padding:14px; color:var(--text-muted); font-size:13px;">
            ${T('noTasksForUser')}
        </div>`;
    }
    document.getElementById('sidebar').innerHTML = html;
}

function selectEmployee(emp) {
    currentEmployee = emp;
    selected = data[emp];
    document.getElementById('empName').innerHTML = emp;
    renderSidebar();
    render();
}

function setFilter(f) {
    filter = f;
    document.querySelectorAll('.filter-group button').forEach(btn => btn.classList.remove('active-filter'));
    document.getElementById(`btn-${f}`).classList.add('active-filter');
    render();
}

function validLink(link) {
    if (!link) return false;
    let cleanLink = link.trim();
    return cleanLink.length > 3 && (cleanLink.startsWith("http") || cleanLink.includes(".com") || cleanLink.includes("drive.google"));
}

// بيحسب حالة أي تاسك (OPEN / CLOSED / DELAY) بناءً على آخر Revision عندها بيانات
function computeTaskStatus(t) {
    let activeRevisions = [];
    t.revisions.forEach(rev => {
        let submitted = (rev.submitted || "").trim();
        if (!submitted) return;
        activeRevisions.push({
            code: (rev.code || "").trim(),
            received: (rev.received || "").trim(),
            delay: Number(rev.duration) || 0
        });
    });

    let status = "OPEN";
    if (activeRevisions.length > 0) {
        let latestRev = activeRevisions[activeRevisions.length - 1];
        if (latestRev.code !== "" && latestRev.received !== "") {
            status = "CLOSED";
        } else if (latestRev.delay > 0) {
            status = "DELAY";
        } else {
            status = "OPEN";
        }
    }
    return status;
}

function buildRevision(rev, taskKey, rawNo, taskTitle, employee) {
    let submitted = (rev.submitted || "").trim();
    let pendingKey = `${taskKey}||${rev.name.trim().toLowerCase()}`;
    let pendingRequest = pendingMap[pendingKey];

    if (!submitted && !pendingRequest) {
        return { html: "", delay: 0, hasData: false };
    }

    let code = (rev.code || "").trim().toUpperCase();
    let link = (rev.link || "").trim();
    let received = (rev.received || "").trim();
    let delay = Number(rev.duration) || 0;

    let codeClass = "code-open"; 
    let codeText = T('codeOpenPending');

    if (code !== "" || received !== "") {
        codeText = code || T('received2');
        if (code === "A" || code === "B") {
            codeClass = "code-success"; 
        } else if (code === "C" || code === "D") {
            codeClass = "code-danger"; 
        } else {
            codeClass = "code-pending"; 
        }
    }

    // لو فيه طلب معلّق لسه ما اتوافقش عليه، بنطغّي على المؤشر ونمنع الرفع المزدوج
    if (pendingRequest) {
        codeClass = "code-review";
        codeText = T('codeReview');
    }

    let viewButtonHtml = validLink(link) 
        ? `<a class="link-btn view-btn" href="${link}" target="_blank">🔗 ${T('viewFile')}</a>` 
        : `<button class="link-btn view-btn" style="opacity:0.5; cursor:not-allowed;" disabled>🔗 ${T('noFile')}</button>`;

    let uploadButtonHtml;
    if (pendingRequest) {
        uploadButtonHtml = `<button class="link-btn pending-btn" style="opacity:0.7; cursor:not-allowed;" disabled>⏳ ${T('pendingApproval')}</button>`;
    } else {
        uploadButtonHtml = `<button class="link-btn upload-btn" onclick="triggerUpload('${taskKey}', '${rev.name}', '${rawNo || '-'}', '${(taskTitle || '').replace(/'/g, "\\'")}', '${(employee || '').replace(/'/g, "\\'")}')">📁 ${T('uploadFile')}</button>`;
    }

    let submittedLine = submitted
        ? `${T('submitted')}: ${submitted} ${received ? " | " + T('received') + ": " + received : ""}`
        : (pendingRequest ? `${T('pendingUploadNote')} (${pendingRequest.file_name || ''})` : "");

    let html = `
    <div class="revision-box ${pendingRequest ? 'is-pending' : ''}">
        <div class="revision-header">
            <span>${rev.name}</span>
            <span class="code-tag ${codeClass}">${pendingRequest ? codeText : 'Code: ' + codeText}</span>
        </div>
        <div class="small">
            ${submittedLine}
        </div>
        ${delay > 0 ? `<div class="small" style="color:var(--danger); font-weight:600; margin-top:4px;">${T('delayDays')}: ${delay} ${T('days')}</div>` : ""}
        <div style="margin-top: 8px;">
            ${uploadButtonHtml}
            ${viewButtonHtml}
        </div>
    </div>
    `;

    return { html: html, delay: delay, hasData: true };
}

function triggerUpload(taskKey, revName, rawNo, taskTitle, employee) {
    currentUploadTaskKey = taskKey;
    currentUploadRevName = revName;
    currentUploadRawNo = rawNo;
    currentUploadTaskTitle = taskTitle;
    currentUploadEmployee = employee;
    document.getElementById('global-file-input').click();
}

// بيحسب ويحدّث عدادات التاسكات (الكل / مفتوح / مغلق / متأخر) للموظف المختار حاليًا
function updateStats() {
    let total = selected.length;
    let openCount = 0, closedCount = 0, delayCount = 0;

    selected.forEach(t => {
        let status = computeTaskStatus(t);
        if (status === "OPEN") openCount++;
        else if (status === "CLOSED") closedCount++;
        else if (status === "DELAY") delayCount++;
    });

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statOpen').textContent = openCount;
    document.getElementById('statClosed').textContent = closedCount;
    document.getElementById('statDelay').textContent = delayCount;
}

function render() {
    let html = "";
    let keyword = document.getElementById('search').value.toLowerCase();
    let tasksContainer = document.getElementById('tasks');

    updateStats();

    selected.forEach(t => {
        let revHTML = "";
        let activeRevisions = [];

        t.revisions.forEach(rev => {
            let result = buildRevision(rev, t.taskKey, t.no, t.title, t.employee);
            if (result.hasData) {
                revHTML += result.html;
                activeRevisions.push({
                    code: (rev.code || "").trim(),
                    received: (rev.received || "").trim(),
                    delay: Number(rev.duration) || 0
                });
            }
        });

        let status = "OPEN"; 
        if (activeRevisions.length > 0) {
            let latestRev = activeRevisions[activeRevisions.length - 1];
            if (latestRev.code !== "" && latestRev.received !== "") {
                status = "CLOSED";
            } else if (latestRev.delay > 0) {
                status = "DELAY";
            } else {
                status = "OPEN";
            }
        }

        if (filter == "closed" && status != "CLOSED") return;
        if (filter == "open" && status != "OPEN") return;
        if (filter == "delay" && status != "DELAY") return;

        let text = ((t.no || "") + " " + (t.title || "") + " " + (t.discipline || "") + " " + (t.activity || "")).toLowerCase();
        if (keyword && !text.includes(keyword)) return;

        let statusLabel = status === "OPEN" ? T('statusOpen') : status === "CLOSED" ? T('statusClosed') : T('statusDelay');

        html += `
        <div class="task">
            <div class="task-activity">${t.activity}</div>
            <div class="title">${t.title}</div>
            <div class="meta-tags">
                <span class="tag">${T('no')}: ${t.no || "-"}</span>
                <span class="tag">${T('discipline')}: ${t.discipline || "-"}</span>
                <span class="tag">${T('rev')}: ${t.rev || "-"}</span>
            </div>
            ${revHTML}
            <div class="status-container">
                <b>${T('status')}:</b>
                <span class="status-badge ${status.toLowerCase()}">${statusLabel}</span>
            </div>
        </div>
        `;
    });

    tasksContainer.innerHTML = html || `<div style="text-align:center; color:var(--text-muted); margin-top:20px;">${T('noSubmittals')}</div>`;
}
</script>
