<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDECO Submittals - General (By Activity)</title>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./auth-guard.js"></script>
<script src="./lang.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: #fff;
            padding: 24px;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: var(--shadow-md);
        }

        .header p {
            margin: 6px 0 0 0;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.85;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            background: var(--bg-card);
            padding: 14px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            transition: all 0.2s ease;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .translate-btn {
            background: var(--primary-light);
            color: var(--primary);
        }

        .dashboard-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .kpi-card {
            background: var(--bg-card);
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border-inline-start: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .kpi-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        .kpi-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .kpi-icon {
            font-size: 32px;
            opacity: 0.15;
            position: absolute;
            left: 20px;
            top: 24px;
        }
        html[dir="ltr"] .kpi-icon { left: auto; right: 20px; }

        .search-area-container { position: relative; margin-bottom: 24px; }
        .search-wrapper { position: relative; }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }
        html[dir="ltr"] .search-icon { right: auto; left: 18px; }

        .search-input {
            width: 100%;
            padding: 16px 50px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            outline: none;
            transition: all 0.2s;
        }
        html[dir="rtl"] .search-input { padding-left: 16px; }
        html[dir="ltr"] .search-input { padding-right: 16px; }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .section-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i { color: var(--primary); }

        /* Discipline (level 1) accordion */
        .discipline-group {
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
            background: var(--bg-card);
        }

        .discipline-header {
            background: linear-gradient(135deg, #f1f5f9, #f8fafc);
            padding: 18px 22px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .discipline-group.active .discipline-header {
            border-bottom: 1px solid var(--border);
        }

        .discipline-icon-indicator {
            transition: transform 0.2s ease;
            color: var(--text-muted);
        }
        .discipline-group.active .discipline-icon-indicator { transform: rotate(180deg); }

        .discipline-content {
            display: none;
            padding: 16px;
            background: #fcfdfe;
        }
        .discipline-group.active .discipline-content { display: block; }

        .discipline-badge {
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
        }

        /* Activity (level 2) sub-accordion */
        .activity-group {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            background: var(--bg-card);
        }

        .activity-header {
            background: #f8fafc;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .activity-group.active .activity-header {
            border-bottom: 1px solid var(--border);
            background: #eef2f7;
        }

        .activity-icon-indicator {
            transition: transform 0.2s ease;
            color: var(--text-muted);
            font-size: 12px;
        }
        .activity-group.active .activity-icon-indicator { transform: rotate(180deg); }

        .activity-content {
            display: none;
            padding: 12px;
        }
        .activity-group.active .activity-content { display: block; }

        .activity-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            background: var(--primary-light);
            color: var(--primary);
        }

        .tasks-grid { display: flex; flex-direction: column; gap: 10px; }

        .task-card {
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            border-inline-start: 4px solid var(--primary);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            text-align: start;
            transition: background 0.15s;
        }
        .task-card:hover { background: #f8fafc; }

        .task-row-main { display: flex; align-items: center; gap: 24px; flex: 1; }

        .task-title-col { flex: 2; min-width: 200px; }
        .task-title { font-size: 14px; font-weight: 700; margin: 0 0 4px 0; }
        .task-ref { font-size: 12px; color: var(--text-muted); }

        .task-dates-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
            color: var(--text-muted);
            min-width: 160px;
        }

        .task-row-footer {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 160px;
            justify-content: flex-end;
        }

        .link-btn {
            color: var(--primary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .no-records {
            text-align: center;
            color: var(--text-muted);
            padding: 14px;
            font-size: 13px;
        }

        .footer-dot-container { display: flex; justify-content: center; align-items: center; padding: 24px 0; }
        .footer-dot { width: 12px; height: 12px; background-color: var(--primary); border-radius: 50%; opacity: 0.6; }

        @media (max-width: 992px) {
            .task-card { flex-direction: column; align-items: stretch; gap: 12px; }
            .task-row-main { flex-direction: column; align-items: flex-start; gap: 12px; }
            .task-row-footer { justify-content: space-between; border-top: 1px solid var(--border); padding-top: 10px; min-width: unset; }
        }
    </style>
</head>
<body>

<div class="header">
    <span id="ui-main-title">MDECO SUBMITTALS - GENERAL</span>
    <p id="ui-sub-title">Grouped by Activity</p>
</div>

<div class="nav-container">
    <a href="home.html" class="nav-btn"><i class="fa-solid fa-house"></i> <span data-i18n="navHome">الرئيسية</span></a>
    <a href="summary.html" class="nav-btn"><i class="fa-solid fa-chart-column"></i> <span data-i18n="navSummary">الملخص</span></a>
    <a href="task.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> <span data-i18n="navTasks">المهام</span></a>
    <a href="general_by_activity.html" class="nav-btn" style="background:var(--primary-light);color:var(--primary);"><i class="fa-solid fa-layer-group"></i> <span data-i18n="navGeneral">عام</span></a>
    <a href="approvals.html" class="nav-btn"><i class="fa-solid fa-clipboard-check"></i> <span data-i18n="navApprovals">طلبات الموافقة</span></a>
    <a href="team_overview.html" class="nav-btn"><i class="fa-solid fa-users"></i> <span data-i18n="navTeam">نظرة عامة على الموظفين</span></a>
    <a href="performance.html" class="nav-btn"><i class="fa-solid fa-chart-column"></i> <span data-i18n="navDashboard">لوحة التحكم</span></a>
    <button onclick="toggleLanguage()" class="nav-btn translate-btn">
        <i class="fa-solid fa-language"></i> <span id="lang-btn-text">English</span>
    </button>
</div>

<div class="dashboard-container">

    <img src="./images/spark-building .jpeg" alt="ECODAN Offices - Spark Project"
         style="width:100%; border-radius:12px; box-shadow: var(--shadow-md); margin-bottom:24px; display:block;">

    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-value" id="count-total">0</div>
            <div class="kpi-title" data-i18n="kpiTotal">Total Filtered</div>
            <i class="fa-solid fa-layer-group kpi-icon"></i>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" style="font-size:24px;">General</div>
            <div class="kpi-title" data-i18n="kpiDisciplines">Discipline</div>
            <i class="fa-solid fa-diagram-project kpi-icon"></i>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" id="count-activities">0</div>
            <div class="kpi-title" data-i18n="kpiActivities">Activities</div>
            <i class="fa-solid fa-list kpi-icon"></i>
        </div>
    </div>

    <div class="search-area-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input id="search-bar" class="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="اكتب للبحث... (رقم المعاملة، العنوان، التخصص، أو النشاط)" onkeyup="onSearchInputChange()" autocomplete="off">
        </div>
    </div>

    <div class="section-card">
        <div class="section-title" id="tasks-title"><i class="fa-solid fa-sitemap"></i> <span data-i18n="groupedTitle">مستندات General مصنّفة حسب النشاط (Activity)</span></div>
        <div id="accordions-container"></div>
    </div>

</div>

<div class="footer-dot-container"><div class="footer-dot"></div></div>

<script>
let allRows = [];
let currentLang = (typeof window.getCurrentLang === 'function') ? window.getCurrentLang() : 'ar';

const SUPABASE_URL = "https://uhhtvpxtpayovbtmnstz.supabase.co";
const SUPABASE_KEY = "sb_publishable_QsS0UhLBORy6mOaBDgW62g_9OacC3oO";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const dictionary = {
    ar: {
        kpiTotal: "إجمالي النتائج",
        kpiDisciplines: "عدد التخصصات",
        kpiActivities: "عدد الأنشطة",
        groupedTitle: "مستندات General مصنّفة حسب النشاط (Activity)",
        searchPlaceholder: "اكتب للبحث... (رقم المعاملة، العنوان، التخصص، أو النشاط)",
        noRecords: "لا توجد سجلات.",
        refLabel: "المرجع",
        techDoc: "المرفق",
        submittalsCount: "عنصر",
        submitted: "تاريخ الإرسال",
        received: "تاريخ الاستلام"
    },
    en: {
        kpiTotal: "Total Results",
        kpiDisciplines: "Disciplines",
        kpiActivities: "Activities",
        groupedTitle: "General Documents Grouped by Activity",
        searchPlaceholder: "Type to search... (Ref No, Title, Discipline, or Activity)",
        noRecords: "No records found.",
        refLabel: "Ref",
        techDoc: "Attachment",
        submittalsCount: "items",
        submitted: "Submitted",
        received: "Received"
    }
};
window.registerDictionary(dictionary);

// This page only ever shows rows where discipline = 'General'
const DISCIPLINE_FILTER = 'General';

async function loadData() {
    try {
        const { data: rows, error } = await supabaseClient
            .from('submittals')
            .select('*')
            .ilike('discipline', DISCIPLINE_FILTER);
        if (error) throw error;
        // Extra safety net: trim + case-insensitive compare client-side too,
        // in case discipline has stray spaces or mixed case in the DB.
        allRows = (rows || []).filter(row => (row.discipline || '').trim().toLowerCase() === DISCIPLINE_FILTER.toLowerCase());
        render();
    } catch (err) {
        console.error("Error fetching data:", err);
        document.getElementById('accordions-container').innerText = "فشل في تحميل البيانات. يرجى التحقق من الاتصال.";
    }
}
loadData();

// lang.js يستدعي الدالة دي تلقائيًا كل ما اللغة تتغيّر (وأول ما الصفحة تحمّل)
window.onLanguageChanged = function (lang) {
    currentLang = lang;
    render();
};

function getFilteredRows() {
    let searchKey = document.getElementById('search-bar').value.toLowerCase().trim();
    if (searchKey === "") return allRows;
    return allRows.filter(row => {
        return (row.no || "").toLowerCase().includes(searchKey) ||
               (row.title || "").toLowerCase().includes(searchKey) ||
               (row.discipline || "").toLowerCase().includes(searchKey) ||
               (row.activity || "").toLowerCase().includes(searchKey) ||
               (row.action_by || "").toLowerCase().includes(searchKey);
    });
}

function onSearchInputChange() {
    render();
}

function toggleDiscipline(id) {
    document.getElementById(id).classList.toggle('active');
}
function toggleActivity(id) {
    document.getElementById(id).classList.toggle('active');
}

function render() {
    let filtered = getFilteredRows();

    // Discipline is fixed to General on this page, so group directly by Activity.
    let activities = {}; // normKey -> { labelCounts, items: [] }
    filtered.forEach(row => {
        let raw = (row.activity || (currentLang === 'ar' ? 'غير محدد' : 'Unspecified')).trim();
        let normKey = raw.toLowerCase().replace(/\s+/g, ' ');
        if (!activities[normKey]) activities[normKey] = { labelCounts: {}, items: [] };
        activities[normKey].labelCounts[raw] = (activities[normKey].labelCounts[raw] || 0) + 1;
        activities[normKey].items.push(row);
    });

    let actKeys = Object.keys(activities).sort((a, b) => {
        let la = Object.keys(activities[a].labelCounts).sort((x, y) => activities[a].labelCounts[y] - activities[a].labelCounts[x])[0];
        let lb = Object.keys(activities[b].labelCounts).sort((x, y) => activities[b].labelCounts[y] - activities[b].labelCounts[x])[0];
        return la.localeCompare(lb);
    });

    document.getElementById('count-total').innerText = filtered.length;
    document.getElementById('count-activities').innerText = actKeys.length;

    let isSearching = document.getElementById('search-bar').value.trim() !== "";
    let html = "";

    actKeys.forEach((aKey, aIdx) => {
        let aGroup = activities[aKey];
        let aLabel = Object.keys(aGroup.labelCounts).sort((a, b) => aGroup.labelCounts[b] - aGroup.labelCounts[a])[0];
        let aId = `act-${aIdx}`;

        let cardsHtml = "";
        if (aGroup.items.length === 0) {
            cardsHtml = `<div class="no-records">${dictionary[currentLang].noRecords}</div>`;
        } else {
            cardsHtml = `<div class="tasks-grid">`;
            aGroup.items.forEach(row => {
                cardsHtml += `
                    <div class="task-card">
                        <div class="task-row-main">
                            <div class="task-title-col">
                                <div class="task-title">${row.title || 'Untitled'}</div>
                                <div class="task-ref">${dictionary[currentLang].refLabel}: <b>${row.no || 'N/A'}</b></div>
                            </div>
                            <div class="task-dates-col">
                                ${row.submitted_on ? `<span><b>${dictionary[currentLang].submitted}:</b> ${row.submitted_on}</span>` : ''}
                                ${row.received_on ? `<span><b>${dictionary[currentLang].received}:</b> ${row.received_on}</span>` : ''}
                            </div>
                        </div>
                        <div class="task-row-footer">
                            ${row.link && row.link.startsWith('http') ? `<a href="${row.link}" target="_blank" class="link-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${dictionary[currentLang].techDoc}</a>` : ''}
                            <span style="font-size:12px; font-weight:600; color:var(--text-muted); white-space: nowrap;"><i class="fa-regular fa-user"></i> ${row.action_by || 'Staff'}</span>
                        </div>
                    </div>
                `;
            });
            cardsHtml += `</div>`;
        }

        let aActiveClass = isSearching ? "active" : "";
        html += `
            <div class="activity-group ${aActiveClass}" id="${aId}">
                <div class="activity-header" onclick="toggleActivity('${aId}')">
                    <div>
                        <i class="fa-solid fa-chevron-down activity-icon-indicator" style="margin-inline-end:8px;"></i>
                        <span>${aLabel}</span>
                    </div>
                    <span class="activity-badge">${aGroup.items.length} ${dictionary[currentLang].submittalsCount}</span>
                </div>
                <div class="activity-content">${cardsHtml}</div>
            </div>
        `;
    });

    document.getElementById('accordions-container').innerHTML = html || `<div class="no-records">${dictionary[currentLang].noRecords}</div>`;
}
</script>

</body>
</html>
